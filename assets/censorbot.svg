<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="CensorBot robot">
  <!-- antenna -->
  <line x1="60" y1="24" x2="60" y2="11" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="60" cy="9" r="6" fill="#ef4444" stroke="#334155" stroke-width="3"/>
  <circle cx="58" cy="7" r="1.8" fill="#ffffff" opacity="0.8"/>

  <!-- ears -->
  <rect x="12" y="40" width="12" height="22" rx="5" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
  <rect x="96" y="40" width="12" height="22" rx="5" fill="#94a3b8" stroke="#334155" stroke-width="3"/>

  <!-- head -->
  <rect x="21" y="23" width="78" height="60" rx="20" fill="#e2e8f0" stroke="#334155" stroke-width="3.5"/>

  <!-- face screen -->
  <rect x="31" y="33" width="58" height="40" rx="13" fill="#1e293b"/>

  <!-- eyes -->
  <ellipse cx="47" cy="48" rx="6" ry="7" fill="#5eead4"/>
  <ellipse cx="73" cy="48" rx="6" ry="7" fill="#5eead4"/>
  <circle cx="49" cy="45.5" r="2" fill="#ffffff"/>
  <circle cx="75" cy="45.5" r="2" fill="#ffffff"/>

  <!-- cheeks -->
  <ellipse cx="37" cy="60" rx="4" ry="2.6" fill="#f472b6" opacity="0.75"/>
  <ellipse cx="83" cy="60" rx="4" ry="2.6" fill="#f472b6" opacity="0.75"/>

  <!-- censored mouth: a little bar of asterisks -->
  <rect x="47" y="58" width="26" height="9" rx="4.5" fill="#ef4444"/>
  <g fill="#ffffff">
    <circle cx="53" cy="62.5" r="1.6"/>
    <circle cx="60" cy="62.5" r="1.6"/>
    <circle cx="67" cy="62.5" r="1.6"/>
  </g>

  <!-- neck -->
  <rect x="52" y="83" width="16" height="6" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="3"/>

  <!-- body -->
  <rect x="32" y="88" width="56" height="27" rx="11" fill="#e2e8f0" stroke="#334155" stroke-width="3.5"/>

  <!-- arms -->
  <path d="M32 98 q-10 2 -12 -8" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="20" cy="88" r="4" fill="#94a3b8" stroke="#334155" stroke-width="2.5"/>
  <path d="M88 98 q10 2 12 8" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="100" cy="107" r="4" fill="#94a3b8" stroke="#334155" stroke-width="2.5"/>

  <!-- shield badge on the chest -->
  <path d="M60 93 l9 3.5 v5.5 c0 5 -4 8.5 -9 10.5 c-5 -2 -9 -5.5 -9 -10.5 v-5.5 z" fill="#ef4444" stroke="#334155" stroke-width="2"/>
  <path d="M56 102.5 l3 3 l5.5 -6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
